[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrlspeech"
version = "0.1.0"
description = "Expressive speech synthesis with coarse-to-fine latent control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["text-to-speech", "tts", "prosody", "speech-synthesis", "diffusion"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "torch>=2.11,<2.15",
    "svae==0.1.0",
    "torchaudio>=2.11,<2.15",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pyworld>=0.3.4",
    # pyworld 0.3.x still imports pkg_resources at runtime.
    "setuptools>=68,<81",
    # LFM2.5 support and cache semantics are pinned for reproducibility.
    "transformers==5.17.0",
    "einops>=0.7",
    "torchdiffeq>=0.2.4",
    "x-transformers>=1.30",
    "onnxruntime>=1.17",
    "omegaconf>=2.3",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "tqdm>=4.65",
    "panel>=1.5",
    "bokeh>=3.4",
]

[project.optional-dependencies]
japanese = [
    "pyopenjtalk-plus>=0.4.1.post9",
]
# Select exactly one accelerator extra; TorchAudio must match its Torch build.
cpu = ["svae[cpu]"]
cuda = ["svae[cuda]"]
rocm = ["svae[rocm]"]
xpu = ["svae[xpu]"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
ctrlspeech = "ctrlspeech.cli:main"
ctrlspeech-train = "ctrlspeech.training.cli:main"

[tool.setuptools.packages.find]
include = ["ctrlspeech*"]

[tool.setuptools.package-data]
ctrlspeech = ["py.typed"]

[tool.pytest.ini_options]
# Include checkout-only demo modules for both `pytest` and `python -m pytest`.
pythonpath = ["."]

[tool.uv]
required-version = ">=0.12.1"
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }, { extra = "rocm" }, { extra = "xpu" }],
    [{ package = "svae", extra = "cpu" }, { package = "svae", extra = "cuda" }, { package = "svae", extra = "rocm" }, { package = "svae", extra = "xpu" }],
]
# This exact AMD release has different Linux/Windows wheel metadata.
# Preserve Linux-only requirements when uv makes the universal lock.
override-dependencies = [
    { package = { name = "torch", version = "2.14.0+rocm10.1.0" }, dependencies = [
        "triton==3.8.0+git669b31ac.rocm10.1.0; sys_platform == 'linux'",
        "amd-torch-device-gfx1250==2.14.0+rocm10.1.0; sys_platform == 'linux' and (extra == 'device-all' or extra == 'device-gfx1250')",
        "amd-torch-device-gfx942==2.14.0+rocm10.1.0; sys_platform == 'linux' and (extra == 'device-all' or extra == 'device-gfx942')",
        "amd-torch-device-gfx950==2.14.0+rocm10.1.0; sys_platform == 'linux' and (extra == 'device-all' or extra == 'device-gfx950')",
    ] },
]

[tool.uv.sources]
setuptools = { index = "pypi" }
svae = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "amd-rocm"
url = "https://stable.repo.amd.com/rocm/whl-next/"
# The device-all extra requires AMD's architecture-specific transitive wheels.
explicit = false

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.workspace]
members = ["packages/svae"]
