name: Japanese LFM2 CI

on:
  push:
    branches: [japanese, "refine-japanese*"]
  pull_request:
    branches: [main, japanese]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install CPU test dependencies
        run: uv sync --frozen --extra cpu --extra japanese --group dev

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall -q ctrlspeech packages/svae/src demo tests

      - name: CPU regressions (native ONNX runtime isolated)
        env:
          CTRLSPEECH_TEST_ISOLATE_ONNX: "1"
        run: uv run --no-sync pytest -q
