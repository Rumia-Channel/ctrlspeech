name: Japanese LFM2 CI

on:
  push:
    branches: [japanese]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync environment
        run: uv sync --extra japanese --group dev

      - name: Import smoke test
        run: uv run python -c "import ctrlspeech; import transformers; print(transformers.__version__)"

      - name: Run tests
        run: uv run pytest -q
